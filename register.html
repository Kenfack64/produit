<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CosmoPro - Inscription</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <!-- Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Notre CSS global -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background: linear-gradient(135deg, var(--primary-dark), #1a2f5a);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .register-card {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-hover);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .register-card .logo {
            font-size: 36px;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 10px;
        }

        .register-card .logo span {
            color: var(--accent);
        }

        .register-card h2 {
            color: var(--primary-dark);
            margin-bottom: 30px;
            font-weight: 500;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--primary-dark);
        }

        .input-group {
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            font-size: 18px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 16px;
            transition: all 0.3s;
            box-sizing: border-box;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
        }

        .btn-register {
            width: 100%;
            padding: 15px;
            border-radius: 50px;
            font-size: 18px;
            margin-top: 10px;
        }

        .login-link {
            margin-top: 20px;
            color: #777;
        }

        .login-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        .password-hint {
            font-size: 12px;
            color: #777;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="register-card">
        <div class="logo">✨ <span>CosmoPro</span></div>
        <h2>Créer un compte boutique</h2>

        <form id="registerForm" method="POST" action="backend/api/register.php">
            <!-- Nom de la boutique -->
            <div class="form-group">
                <label>Nom de la boutique</label>
                <div class="input-group">
                    <i class="fas fa-store"></i>
                    <input type="text" name="shop_name" placeholder="Ex: Beauty Shop" required>
                </div>
            </div>

            <!-- Nom du propriétaire -->
            <div class="form-group">
                <label>Nom du propriétaire</label>
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" name="owner_name" placeholder="Votre nom" required>
                </div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label>Email</label>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" name="email" placeholder="boutique@exemple.com" required>
                </div>
            </div>

            <!-- Téléphone -->
            <div class="form-group">
                <label>Téléphone</label>
                <div class="input-group">
                    <i class="fas fa-phone-alt"></i>
                    <input type="tel" name="phone" placeholder="06 12 34 56 78" required>
                </div>
            </div>

            <!-- Mot de passe -->
            <div class="form-group">
                <label>Mot de passe</label>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" id="password" placeholder="••••••••" required>
                </div>
                <div class="password-hint">Au moins 8 caractères</div>
            </div>

            <!-- Confirmation mot de passe -->
            <div class="form-group">
                <label>Confirmer le mot de passe</label>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="confirm_password" id="confirm_password" placeholder="••••••••" required>
                </div>
                <div class="error-message" id="passwordError">Les mots de passe ne correspondent pas</div>
            </div>

            <button type="submit" class="btn btn-register">S'inscrire</button>
        </form>

        <div class="login-link">
            <p>Déjà inscrit ? <a href="login.html">Connectez-vous</a></p>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm_password').value;
            const errorDiv = document.getElementById('passwordError');

            if (password !== confirm) {
                e.preventDefault();
                errorDiv.style.display = 'block';
            } else {
                errorDiv.style.display = 'none';
            }

            // Optionnel : validation longueur mot de passe
            if (password.length < 8) {
                e.preventDefault();
                alert('Le mot de passe doit contenir au moins 8 caractères.');
            }
        });
    </script>
</body>
</html>
