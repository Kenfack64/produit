<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CosmoPro - Paramètres</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Poppins', sans-serif;
    margin: 0;
    padding: 0;
    background: #0b1d3a;
    color: #fff;
}

.container {
    max-width: 900px;
    margin: 40px auto;
    padding: 20px;
}

h2 {
    color: #d4af37;
    text-align: center;
    margin-bottom: 30px;
}

.form-section {
    background: #132b57;
    padding: 30px;
    border-radius: 15px;
    margin-bottom: 30px;
    box-shadow: 0 0 15px rgba(212,175,55,0.3);
}

.form-section h3 {
    color: #d4af37;
    margin-bottom: 20px;
}

.form-section input, .form-section select {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: none;
    border-radius: 8px;
    outline: none;
}

.form-section button {
    background: #d4af37;
    color: #0b1d3a;
    border: none;
    padding: 12px 25px;
    font-size: 16px;
    border-radius: 50px;
    cursor: pointer;
    margin-top: 10px;
    transition: 0.3s;
}

.form-section button:hover {
    box-shadow: 0 0 20px #d4af37;
    transform: scale(1.05);
}

/* WhatsApp bouton flottant */
.whatsapp-btn {
    position: fixed;
    bottom: 25px;
    right: 25px;
    background: #25D366;
    color: white;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 18px;
    border-radius: 50px;
    text-decoration: none;
    font-weight: bold;
    box-shadow: 0 0 15px rgba(0,0,0,0.3);
    z-index: 999;
    animation: pulse 2s infinite;
}

.whatsapp-btn:hover {
    transform: scale(1.05);
}

@keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(37,211,102,0.6); }
    70% { box-shadow: 0 0 0 15px rgba(37,211,102,0); }
    100% { box-shadow: 0 0 0 0 rgba(37,211,102,0); }
}

/* Responsive */
@media(max-width:768px){
    .container { padding: 15px; }
}
</style>
</head>

<body>

<div class="container">

    <h2>Paramètres de la Boutique</h2>

    <!-- BOUTIQUE INFO -->
    <div class="form-section">
        <h3>Informations de la boutique</h3>
        <form id="shopForm" method="POST" action="backend/update_shop.php">
            <input type="text" name="shop_name" placeholder="Nom de la boutique" required>
            <input type="email" name="shop_email" placeholder="Email" required>
            <input type="tel" name="shop_phone" placeholder="Téléphone" required>
            <button type="submit">Mettre à jour la boutique</button>
        </form>
    </div>

    <!-- UTILISATEUR INFO -->
    <div class="form-section">
        <h3>Informations du compte</h3>
        <form id="userForm" method="POST" action="backend/update_user.php">
            <input type="text" name="user_name" placeholder="Nom complet" required>
            <input type="email" name="user_email" placeholder="Email" required>
            <input type="password" name="user_password" placeholder="Nouveau mot de passe">
            <input type="password" name="user_confirm_password" placeholder="Confirmer mot de passe">
            <button type="submit">Mettre à jour le compte</button>
        </form>
    </div>

    <!-- NOTIFICATIONS / FIDÉLITÉ -->
    <div class="form-section">
        <h3>Préférences</h3>
        <form id="preferencesForm" method="POST" action="backend/update_preferences.php">
            <label>
                <input type="checkbox" name="notify_stock" value="1"> Recevoir alertes stock faible
            </label>
            <label>
                <input type="checkbox" name="notify_expiry" value="1"> Recevoir alertes produits expirés
            </label>
            <label>
                <input type="checkbox" name="enable_qr" value="1"> Activer carte fidélité QR code
            </label>
            <button type="submit">Mettre à jour les préférences</button>
        </form>
    </div>

</div>

<!-- WhatsApp bouton flottant -->
<a href="https://wa.me/237696492029?text=Bonjour%20👋%20J'ai%20besoin%20d'aide%20avec%20CosmoPro"
   class="whatsapp-btn" target="_blank">
   💬 Discuter
</a>

</body>
</html>
