<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clients - CosmoPro</title>

    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Notre CSS global -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* Styles spécifiques à la page clients */
        .client-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-dark);
            font-size: 24px;
        }

        .stat-info h4 {
            font-size: 14px;
            color: #777;
            margin-bottom: 5px;
        }

        .stat-info p {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-dark);
        }

        /* Badge fidélité */
        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge.gold {
            background: #d4af37;
            color: var(--primary-dark);
        }

        .badge.silver {
            background: #c0c0c0;
            color: #333;
        }

        .badge.bronze {
            background: #cd7f32;
            color: white;
        }

        /* Modale pour historique */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: var(--border-radius);
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-modal {
            font-size: 28px;
            cursor: pointer;
            color: #aaa;
        }

        .close-modal:hover {
            color: #333;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">✨ CosmoPro</div>
        <a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a href="products.html"><i class="fas fa-box"></i> Produits</a>
        <a href="clients.html" class="active"><i class="fas fa-users"></i> Clients</a>
        <a href="sales.html"><i class="fas fa-shopping-cart"></i> Ventes</a>
        <a href="settings.html"><i class="fas fa-cog"></i> Paramètres</a>
    </div>

    <!-- Main Content -->
    <div class="main">
        <div class="header">
            <h1>Gestion des clients</h1>
            <button class="btn" id="showFormBtn"><i class="fas fa-user-plus"></i> Nouveau client</button>
        </div>

        <!-- Statistiques clients -->
        <div class="client-stats">
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-users"></i></div>
                <div class="stat-info">
                    <h4>Total clients</h4>
                    <p id="totalClients">124</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-star"></i></div>
                <div class="stat-info">
                    <h4>Fidélité or</h4>
                    <p id="goldClients">45</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-gift"></i></div>
                <div class="stat-info">
                    <h4>Points distribués</h4>
                    <p id="totalPoints">12 450</p>
                </div>
            </div>
        </div>

        <!-- Formulaire d'ajout (caché par défaut) -->
        <div class="form-card" id="clientFormContainer" style="display: none;">
            <h3>Ajouter un client</h3>
            <form id="clientForm">
                <div class="form-group">
                    <label>Nom complet *</label>
                    <input type="text" id="clientName" placeholder="Ex: Marie Dupont" required>
                </div>
                <div class="form-row" style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex:1;">
                        <label>Téléphone</label>
                        <input type="tel" id="phone" placeholder="06 12 34 56 78">
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="marie@email.com">
                    </div>
                </div>
                <div class="form-row" style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex:1;">
                        <label>Type de peau</label>
                        <input type="text" id="skinType" placeholder="Ex: Sèche">
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>Date de naissance</label>
                        <input type="date" id="birthdate">
                    </div>
                </div>
                <div class="form-group">
                    <label>Préférences / Produits favoris</label>
                    <textarea id="preferences" rows="2" placeholder="Ex: Crème hydratante, Rouge à lèvres rouge"></textarea>
                </div>
                <div class="form-group">
                    <label>Points de fidélité</label>
                    <input type="number" id="points" value="0" min="0">
                </div>
                <button type="submit" class="btn">Enregistrer</button>
                <button type="button" class="btn-outline" id="cancelFormBtn">Annuler</button>
            </form>
        </div>

        <!-- Tableau des clients -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Nom</th>
                        <th>Téléphone</th>
                        <th>Email</th>
                        <th>Type peau</th>
                        <th>Points</th>
                        <th>Fidélité</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="clientTable">
                    <!-- Les lignes seront injectées par JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modale Historique d'achat -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Historique d'achat - <span id="modalClientName"></span></h3>
                <span class="close-modal">&times;</span>
            </div>
            <div id="modalHistoryContent">
                <!-- Contenu dynamique -->
                <p>Aucun achat récent.</p>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        // Données simulées pour les clients
        let clients = [
            { id: 1, name: 'Marie Dupont', phone: '06 12 34 56 78', email: 'marie@email.com', skin: 'Sèche', birth: '1990-05-12', prefs: 'Crème hydratante', points: 250, history: ['Crème hydratante - 12/03/2025', 'Rouge à lèvres - 05/03/2025'] },
            { id: 2, name: 'Sophie Martin', phone: '07 98 76 54 32', email: 'sophie@email.com', skin: 'Mixte', birth: '1985-08-22', prefs: 'Masque', points: 120, history: ['Masque visage - 10/03/2025'] },
            { id: 3, name: 'Jean Claude', phone: '06 54 32 19 87', email: 'jc@email.com', skin: 'Grasse', birth: '1992-11-02', prefs: 'Gel nettoyant', points: 480, history: ['Gel nettoyant - 15/03/2025', 'Sérum - 01/03/2025'] }
        ];

        // Fonction pour afficher les clients
        function renderClients() {
            const tbody = document.getElementById('clientTable');
            tbody.innerHTML = '';
            clients.forEach(c => {
                // Déterminer le badge fidélité
                let badgeClass = 'bronze';
                let badgeText = 'Bronze';
                if (c.points >= 300) {
                    badgeClass = 'gold';
                    badgeText = 'Or';
                } else if (c.points >= 150) {
                    badgeClass = 'silver';
                    badgeText = 'Argent';
                }

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${c.name}</td>
                    <td>${c.phone}</td>
                    <td>${c.email}</td>
                    <td>${c.skin}</td>
                    <td>${c.points}</td>
                    <td><span class="badge ${badgeClass}">${badgeText}</span></td>
                    <td>
                        <i class="fas fa-history" style="color: var(--accent); cursor:pointer;" onclick="showHistory(${c.id})" title="Historique"></i>
                        <i class="fas fa-edit" style="color: var(--accent); margin-left:10px; cursor:pointer;" onclick="editClient(${c.id})" title="Modifier"></i>
                        <i class="fas fa-trash" style="color: #e74c3c; margin-left:10px; cursor:pointer;" onclick="deleteClient(${c.id})" title="Supprimer"></i>
                    </td>
                `;
                tbody.appendChild(row);
            });

            // Mise à jour des stats
            document.getElementById('totalClients').innerText = clients.length;
            const gold = clients.filter(c => c.points >= 300).length;
            document.getElementById('goldClients').innerText = gold;
            const totalPoints = clients.reduce((acc, c) => acc + c.points, 0);
            document.getElementById('totalPoints').innerText = totalPoints;
        }

        // Afficher l'historique dans la modale
        window.showHistory = function(clientId) {
            const client = clients.find(c => c.id === clientId);
            if (!client) return;
            document.getElementById('modalClientName').innerText = client.name;
            const historyDiv = document.getElementById('modalHistoryContent');
            if (client.history && client.history.length > 0) {
                let html = '<ul>';
                client.history.forEach(item => {
                    html += `<li>${item}</li>`;
                });
                html += '</ul>';
                historyDiv.innerHTML = html;
            } else {
                historyDiv.innerHTML = '<p>Aucun achat récent.</p>';
            }
            document.getElementById('historyModal').style.display = 'flex';
        };

        // Fermer la modale
        document.querySelector('.close-modal').addEventListener('click', function() {
            document.getElementById('historyModal').style.display = 'none';
        });
        window.addEventListener('click', function(e) {
            if (e.target.classList.contains('modal')) {
                document.getElementById('historyModal').style.display = 'none';
            }
        });

        // Gestion formulaire
        document.getElementById('showFormBtn').addEventListener('click', function() {
            document.getElementById('clientFormContainer').style.display = 'block';
        });
        document.getElementById('cancelFormBtn').addEventListener('click', function() {
            document.getElementById('clientFormContainer').style.display = 'none';
            document.getElementById('clientForm').reset();
        });

        document.getElementById('clientForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Récupérer les valeurs
            const newClient = {
                id: clients.length + 1,
                name: document.getElementById('clientName').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                skin: document.getElementById('skinType').value,
                birth: document.getElementById('birthdate').value,
                prefs: document.getElementById('preferences').value,
                points: parseInt(document.getElementById('points').value) || 0,
                history: []
            };
            clients.push(newClient);
            renderClients();
            this.reset();
            document.getElementById('clientFormContainer').style.display = 'none';
        });

        // Supprimer client
        window.deleteClient = function(id) {
            if (confirm('Supprimer ce client ?')) {
                clients = clients.filter(c => c.id !== id);
                renderClients();
            }
        };

        // Modifier client (simplifié : on pré-remplit le formulaire - à améliorer)
        window.editClient = function(id) {
            const client = clients.find(c => c.id === id);
            if (!client) return;
            // Pour l'exemple, on ouvre le formulaire et on pré-remplit (vous pourriez aussi avoir un formulaire dédié)
            alert('Fonction modifier à implémenter (édition en place ou redirection)');
            // Idéalement, ouvrir un formulaire avec les valeurs actuelles
        };

        // Initialisation
        renderClients();
    </script>
</body>
</html>
